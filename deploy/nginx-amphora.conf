server {
    listen 80;
    server_name api.amphora.example;   # ← your domain
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # REQUIRED: the API rate-limits on this header. Without it every visitor
        # shares one bucket keyed on 127.0.0.1 and two people lock each other out.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;  # pass through from Cloudflare
    }
}
